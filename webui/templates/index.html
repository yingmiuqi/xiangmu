<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>图片清洗工具</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6fa; color: #333; }
  .wrap { max-width: 900px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  .card { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 16px;
         box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 300px; padding: 8px 10px; border: 1px solid #ccc;
                     border-radius: 6px; font-size: 14px; }
  button { padding: 9px 18px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
  .primary { background: #2f6fed; color: #fff; }
  .danger { background: #e5484d; color: #fff; }
  .gray { background: #eef0f4; color: #333; }
  .status { font-size: 15px; line-height: 1.9; }
  .bar { height: 14px; background: #e7eaf0; border-radius: 7px; overflow: hidden; margin: 8px 0; }
  .bar>div { height: 100%; background: #2f6fed; width: 0; transition: width .5s; }
  pre { background: #1e1e2e; color: #cdd6f4; padding: 12px; border-radius: 8px; max-height: 260px;
        overflow: auto; font-size: 12px; white-space: pre-wrap; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 13px; }
  .tag.on { background: #e6f7e6; color: #1a7f37; }
  .tag.off { background: #fdecea; color: #c0392b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>图片清洗工具</h1>
  <div class="card">
    <div class="row">
      <input type="text" id="batch" placeholder="批次目录（含 images 子目录）">
      <button class="gray" onclick="savePath()">设置批次</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" onclick="startTask(false)">启动（仅分析）</button>
      <button class="danger" onclick="startTask(true)">启动并移动</button>
      <button class="gray" onclick="stopTask()">暂停</button>
      <button class="gray" onclick="openDir('err')">打开ERR</button>
      <button class="gray" onclick="openDir('report')">打开报告</button>
    </div>
  </div>
  <div class="card">
    <div class="status">
      状态：<span id="run" class="tag off">未运行</span><br>
      批次：<span id="batchName">-</span><br>
      进度：<span id="done">0</span> / <span id="total">0</span>
      <div class="bar"><div id="pbar"></div></div>
      已移动进ERR：<span id="err">0</span> 张
    </div>
  </div>
  <div class="card">
    <div style="font-weight:600; margin-bottom:8px">运行日志（末尾）</div>
    <pre id="log">-</pre>
  </div>
</div>
<script>
function fmt(n){ return Number(n).toLocaleString(); }
async function refresh(){
  try {
    const r = await fetch('/api/status'); const d = await r.json();
    document.getElementById('batch').value = d.batch;
    document.getElementById('batchName').textContent = d.batch;
    document.getElementById('done').textContent = fmt(d.done);
    document.getElementById('total').textContent = fmt(d.total);
    document.getElementById('err').textContent = fmt(d.err);
    const pct = d.total ? Math.round(100*d.done/d.total) : 0;
    document.getElementById('pbar').style.width = pct + '%';
    const tag = document.getElementById('run');
    tag.textContent = d.running ? '运行中' : '未运行';
    tag.className = 'tag ' + (d.running ? 'on' : 'off');
    if (d.log) document.getElementById('log').textContent = d.log;
  } catch(e) { document.getElementById('log').textContent = '连接失败: ' + e; }
}
async function savePath(){
  const p = document.getElementById('batch').value.trim();
  const r = await fetch('/api/save-path', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({path:p})});
  const d = await r.json(); alert(d.msg); refresh();
}
async function startTask(move){
  if (!confirm(move ? '确认启动【真实移动】模式？移动后可通过日志回退。' : '确认启动【仅分析】模式？')) return;
  const r = await fetch('/api/start', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({move})});
  const d = await r.json(); alert(d.msg); setTimeout(refresh, 3000);
}
async function stopTask(){ await fetch('/api/stop'); alert('正在安全暂停...'); setTimeout(refresh, 3000); }
async function openDir(t){ await fetch('/api/open', {method:'POST', headers:{'Content-Type':'application/json'},
  body: JSON.stringify({target:t})}); }
setInterval(refresh, 2000); refresh();
</script>
</body>
</html>
